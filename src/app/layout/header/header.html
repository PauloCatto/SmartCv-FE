<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="navbar-inner">
    <!-- Logo -->
    <a routerLink="/" class="navbar-logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 12h6M9 16h6M9 8h6M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"
            stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">Smart<span class="gradient-text">CV</span></span>
    </a>

    <!-- Center nav links -->
    @if (auth.isAuthenticated()) {
      <div class="navbar-links">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Dashboard</a>
      </div>
    } @else {
      <div class="navbar-links">
        <a href="#features" class="nav-link">Funcionalidades</a>
        <a href="#templates" class="nav-link">Templates</a>
        <a href="#pricing" class="nav-link">Planos</a>
      </div>
    }

    <!-- Right actions -->
    <div class="navbar-actions">
      @if (auth.isAuthenticated()) {
        <div class="user-menu">
          <div class="user-avatar" (click)="toggleMenu()">
            {{ getUserInitials() }}
          </div>
          @if (menuOpen()) {
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <p class="dropdown-name">{{ auth.user()?.name }}</p>
                <p class="dropdown-email">{{ auth.user()?.email }}</p>
              </div>
              <div class="dropdown-divider"></div>
              <a routerLink="/dashboard" class="dropdown-item" (click)="menuOpen.set(false)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
              </a>
              <button class="dropdown-item danger" (click)="logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                Sair
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/auth/login" class="btn btn-ghost btn-sm">Entrar</a>
        <a routerLink="/auth/register" class="btn btn-primary btn-sm">Começar grátis</a>
      }
    </div>
  </div>
</nav>
