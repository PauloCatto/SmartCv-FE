<aside class="sidebar">
  <div class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidebar-link">
      <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/resume/new" routerLinkActive="active" class="sidebar-link">
      <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span>Novo Currículo</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="user-info-card">
      <div class="user-badge">{{ getUserInitials() }}</div>
      <div class="user-details">
        <span class="user-name">{{ auth.user()?.name || 'Usuário' }}</span>
        <span class="user-plan" [class.premium]="auth.user()?.plan === 'premium'">
          {{ auth.user()?.plan === 'premium' ? 'Plan Premium' : 'Plan Free' }}
        </span>
      </div>
    </div>
    <button class="btn btn-ghost logout-btn" (click)="logout()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Sair</span>
    </button>
  </div>
</aside>
