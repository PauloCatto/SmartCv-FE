<div class="auth-page">
  <div class="auth-bg">
    <div class="auth-orb orb-1"></div>
    <div class="auth-orb orb-2"></div>
    <div class="auth-grid"></div>
  </div>
  <div class="auth-card animate-fade-in-up">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <a routerLink="/" class="auth-logo" style="margin-bottom: 0;">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M9 12h6M9 16h6M9 8h6M5 4h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Prime <span class="gradient-text">Resume</span></span>
      </a>
      <a routerLink="/" class="auth-link" style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        {{ 'AUTH.BACK' | translate }}
      </a>
    </div>
    <div class="auth-header">
      <h1 class="auth-title">{{ 'AUTH.RESET_PASSWORD.TITLE' | translate }}</h1>
      <p class="auth-subtitle">{{ 'AUTH.RESET_PASSWORD.SUBTITLE' | translate }}</p>
    </div>
    
    @if (error()) {
      <div class="alert-error animate-fade-in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error() }}
      </div>
    }

    @if (message()) {
      <div class="alert-success animate-fade-in" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; border: 1px solid rgba(16,185,129,0.2);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        {{ message() }}
      </div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()" #form="ngForm">
      
      <div class="form-group">
        <label class="form-label" for="password">{{ 'AUTH.RESET_PASSWORD.PASSWORD' | translate }}</label>
        <div class="input-wrapper">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" class="form-control" [placeholder]="'AUTH.RESET_PASSWORD.PASSWORD_PLACEHOLDER' | translate" [(ngModel)]="password" name="password" required minlength="6" />
          <button type="button" class="input-toggle" (click)="showPassword.update(v => !v)">
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">{{ 'AUTH.RESET_PASSWORD.CONFIRM_PASSWORD' | translate }}</label>
        <div class="input-wrapper">
          <input id="confirmPassword" [type]="showConfirmPassword() ? 'text' : 'password'" class="form-control" [placeholder]="'AUTH.RESET_PASSWORD.CONFIRM_PASSWORD_PLACEHOLDER' | translate" [(ngModel)]="confirmPassword" name="confirmPassword" required minlength="6" />
          <button type="button" class="input-toggle" (click)="showConfirmPassword.update(v => !v)">
            @if (showConfirmPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;" [disabled]="(auth.loading$ | async) || message() !== '' || !token">
        @if (auth.loading$ | async) {
          <div class="spinner"></div>
          {{ 'AUTH.RESET_PASSWORD.SUBMITTING' | translate }}
        } @else {
          {{ 'AUTH.RESET_PASSWORD.SUBMIT' | translate }}
        }
      </button>
    </form>

    <p class="auth-footer-text">
      <a routerLink="/auth/login" class="auth-link">{{ 'AUTH.RESET_PASSWORD.BACK_TO_LOGIN' | translate }}</a>
    </p>
  </div>
</div>
